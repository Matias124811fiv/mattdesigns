backend:
  name: git-gateway
  branch: main

site_url: https://mattdesigns.dev
display_url: https://mattdesigns.dev
logo_url: https://mattdesigns.dev/assets/MattDesigns%20Logo%20with%20Colorful%20Stripes.png

media_folder: assets
public_folder: /assets
locale: es

collections:
  - name: "sitio"
    label: "Mi web"
    files:
      - name: "contenido"
        label: "Editar contenido"
        file: "data/content.json"
        format: json
        fields:

          - label: "🏠 Hero"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Texto del badge", name: "badge", widget: "string" }
              - { label: "Subtítulo", name: "subtitulo", widget: "text" }

          - label: "📊 Estadísticas"
            name: "estadisticas"
            widget: "list"
            collapsed: true
            fields:
              - { label: "Número", name: "numero", widget: "number" }
              - { label: "Sufijo (+, %, x, d...)", name: "sufijo", widget: "string" }
              - { label: "Etiqueta", name: "etiqueta", widget: "string" }

          - label: "⚡ Servicios"
            name: "servicios"
            widget: "list"
            collapsed: true
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }
              - { label: "Características (una por línea)", name: "caracteristicas", widget: "list" }
              - { label: "¿Es el más popular?", name: "destacado", widget: "boolean", default: false, required: false }

          - label: "🎯 Banner CTA"
            name: "cta_banner"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "string" }
              - { label: "Texto del botón", name: "boton", widget: "string" }

          - label: "🔄 Proceso (pasos)"
            name: "proceso"
            widget: "list"
            collapsed: true
            fields:
              - { label: "Número (01, 02...)", name: "numero", widget: "string" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }
              - { label: "Tiempo (ej: Día 1)", name: "tiempo", widget: "string" }

          - label: "⭐ Testimonios"
            name: "testimonios"
            widget: "list"
            collapsed: true
            fields:
              - { label: "Texto del testimonio", name: "texto", widget: "text" }
              - { label: "Nombre", name: "nombre", widget: "string" }
              - { label: "Cargo / Empresa", name: "cargo", widget: "string" }
              - { label: "URL del avatar", name: "avatar", widget: "string" }

          - label: "💰 Precios"
            name: "precios"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Nota al pie", name: "nota", widget: "text" }
              - label: "Planes"
                name: "planes"
                widget: "list"
                fields:
                  - { label: "Nombre del plan", name: "nombre", widget: "string" }
                  - { label: "Precio (sin $)", name: "precio", widget: "string" }
                  - { label: "Descripción corta", name: "descripcion", widget: "string" }
                  - { label: "Características incluidas", name: "caracteristicas", widget: "list" }
                  - { label: "No incluye", name: "no_incluye", widget: "list", required: false }
                  - { label: "Texto del botón", name: "boton", widget: "string" }
                  - { label: "¿Es el plan destacado?", name: "destacado", widget: "boolean", default: false, required: false }

          - label: "❓ Preguntas frecuentes"
            name: "faq"
            widget: "list"
            collapsed: true
            fields:
              - { label: "Pregunta", name: "pregunta", widget: "string" }
              - { label: "Respuesta", name: "respuesta", widget: "text" }

          - label: "📥 Lead Magnet (guía)"
            name: "lead_magnet"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Título de la guía", name: "titulo", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "string" }
              - { label: "Texto del botón", name: "boton", widget: "string" }

          - label: "📞 Contacto"
            name: "contacto"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Título (parte en color)", name: "titulo_gradiente", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }
              - { label: "Teléfono", name: "telefono", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }

          - label: "👥 Equipo"
            name: "equipo"
            widget: "list"
            collapsed: true
            fields:
              - { label: "Nombre completo", name: "nombre", widget: "string" }
              - { label: "Cargo / Rol", name: "cargo", widget: "string" }
              - { label: "Descripción corta", name: "descripcion", widget: "text" }
              - { label: "URL de foto", name: "avatar", widget: "string", hint: "Link directo a una imagen (jpg/png)" }

          - label: "🔻 Footer"
            name: "footer"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Tagline", name: "tagline", widget: "string" }
