<!DOCTYPE html>
<html>
<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'AW-18221575053');

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MattDesigns — Panel de edición</title>
  <style>
    /* Custom footer */
    #cms-custom-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 99998;
      background: #f5f5f5;
      border-top: 1px solid #ddd;
      text-align: center;
      padding: 8px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #888;
    }
    /* Support button */
    #cms-support-btn {
      position: fixed;
      bottom: 44px;
      right: 20px;
      z-index: 99999;
      background: #25d366;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 100px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      transition: transform .2s, box-shadow .2s;
    }
    #cms-support-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.3); }
    /* History panel */
    #cms-history-panel {
      position: fixed;
      bottom: 44px;
      left: 20px;
      z-index: 99999;
      font-family: Arial, sans-serif;
      font-size: 13px;
      background: #1e1e2e;
      border: 1px solid #333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
      max-width: 320px;
    }
    #cms-hist-toggle {
      width: 100%;
      background: #2a2a3e;
      border: none;
      color: #e2e8f0;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      font-family: Arial, sans-serif;
    }
    #cms-hist-toggle:hover { background: #333350; }
    #cms-hist-body { padding: 12px 16px; }
    #cms-hist-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
    #cms-hist-list li { display: flex; flex-direction: column; gap: 2px; }
    #cms-hist-list a { color: #a78bfa; text-decoration: none; font-size: 12px; line-height: 1.4; }
    #cms-hist-list a:hover { text-decoration: underline; }
    #cms-hist-list span { color: #64748b; font-size: 11px; }
  </style>
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    const SITE_URL = 'https://mattdesigns.dev';

    /* ── Footer copyright ── */
    const footer = document.createElement('div');
    footer.id = 'cms-custom-footer';
    footer.textContent = '© 2026 MattDesigns | Panel de administración';
    document.body.appendChild(footer);

    /* ── Botón contactar soporte ── */
    const supportBtn = document.createElement('a');
    supportBtn.href = 'https://wa.me/5491157991179?text=Hola%20Matias%2C%20necesito%20soporte%20con%20mi%20panel';
    supportBtn.target = '_blank';
    supportBtn.rel = 'noopener';
    supportBtn.id = 'cms-support-btn';
    supportBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.112 1.523 5.843L0 24l6.343-1.502A11.96 11.96 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 0 1-5.017-1.378l-.36-.214-3.727.883.936-3.619-.235-.372A9.775 9.775 0 0 1 2.182 12C2.182 6.57 6.57 2.182 12 2.182S21.818 6.57 21.818 12 17.43 21.818 12 21.818z"/></svg> Contactar soporte`;
    document.body.appendChild(supportBtn);

    /* ── Historial de cambios ── */
    const histPanel = document.createElement('div');
    histPanel.id = 'cms-history-panel';
    histPanel.innerHTML = `
      <button id="cms-hist-toggle" onclick="
        const b = document.getElementById('cms-hist-body');
        b.style.display = b.style.display === 'none' ? 'block' : 'none';
      ">📋 Historial de cambios ▾</button>
      <div id="cms-hist-body" style="display:none">
        <p style="color:#aaa;font-size:12px;margin:0 0 8px">Últimas modificaciones al contenido</p>
        <ul id="cms-hist-list"><li style="color:#aaa">Cargando...</li></ul>
      </div>`;
    document.body.appendChild(histPanel);

    fetch('https://api.github.com/repos/Matias124811fiv/mattdesigns/commits?path=data%2Fcontent.json&per_page=8')
      .then(r => r.json())
      .then(commits => {
        const list = document.getElementById('cms-hist-list');
        if (!list || !Array.isArray(commits)) return;
        list.innerHTML = commits.map(c => {
          const date = new Date(c.commit.author.date).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
          const msg  = c.commit.message.replace(/^["\n]+|["\n]+$/g,'').split('\n')[0];
          return `<li><a href="${c.html_url}" target="_blank" rel="noopener">${msg}</a><span>${date}</span></li>`;
        }).join('');
      })
      .catch(() => {
        const list = document.getElementById('cms-hist-list');
        if (list) list.innerHTML = '<li style="color:#aaa">No se pudo cargar el historial.</li>';
      });

    /* ── Welcome message injected into the heading "Mi web" ── */
    function injectWelcome(name) {
      const obs = new MutationObserver(() => {
        /* Find the main h1/h2 that contains "Mi web" */
        const headings = document.querySelectorAll('h1, h2, [class*="Collection"] h1, [class*="Header"] h1');
        headings.forEach(h => {
          if (h.textContent.trim() === 'Mi web' && !h.dataset.welcomed) {
            h.dataset.welcomed = '1';
            h.textContent = `¡Bienvenido, ${name}!`;
            h.style.background = 'linear-gradient(135deg,#7c3aed,#06b6d4)';
            h.style.webkitBackgroundClip = 'text';
            h.style.webkitTextFillColor = 'transparent';
            h.style.backgroundClip = 'text';

            /* Insert site URL below */
            const sub = document.createElement('p');
            sub.textContent = `Estás editando: ${SITE_URL}`;
            sub.style.cssText = 'font-size:13px;color:#888;margin:4px 0 0;font-weight:normal;-webkit-text-fill-color:#888;background:none;';
            h.insertAdjacentElement('afterend', sub);
          }
        });
      });
      obs.observe(document.body, { childList: true, subtree: true });
    }

    /* ── Role-based UI hiding ── */
    function applyRoleRestrictions(user) {
      const roles = user?.app_metadata?.roles || [];
      const isAdmin = roles.includes('admin');
      if (!isAdmin) {
        /* Hide Users and Configuration nav items for non-admins */
        const obs2 = new MutationObserver(() => {
          document.querySelectorAll('nav a, [class*="Nav"] a, [class*="menu"] a').forEach(a => {
            const text = a.textContent.trim().toLowerCase();
            if (text === 'usuarios' || text === 'configuración' || text === 'users' || text === 'settings') {
              a.style.display = 'none';
            }
          });
        });
        obs2.observe(document.body, { childList: true, subtree: true });
      }
    }

    /* ── Bootstrap on identity ready ── */
    let pollCount = 0;
    const poll = setInterval(() => {
      pollCount++;
      if (pollCount > 40) { clearInterval(poll); return; }
      const user = window.netlifyIdentity && window.netlifyIdentity.currentUser();
      if (user) {
        clearInterval(poll);
        const name = user.user_metadata?.full_name || user.email || 'Usuario';
        injectWelcome(name);
        applyRoleRestrictions(user);
      }
    }, 400);

    window.addEventListener('load', () => {
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('login', user => {
          const name = user.user_metadata?.full_name || user.email || 'Usuario';
          injectWelcome(name);
          applyRoleRestrictions(user);
        });
      }
    });
  </script>
</body>
</html>
